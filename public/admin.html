<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kampit Admin</title>
<style>
:root{color-scheme:dark;--bg:#090e1b;--line:#283650;--text:#f3f6ff;--muted:#91a0ba;--good:#76f1b0;--bad:#ff758b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% -10%,#26315b,var(--bg) 48%);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 20px 50px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}h1{margin:0;font-size:28px}header p{margin:4px 0 0;color:var(--muted)}#status{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--good);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.chart{background:linear-gradient(145deg,#19243c,#111a2c);border:1px solid var(--line);border-radius:16px;padding:16px}.card span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.card strong{display:block;font-size:30px;margin-top:6px}.sections{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}.chart h2{font-size:13px;margin:0 0 18px;letter-spacing:.1em}.bars{height:190px;display:flex;align-items:end;gap:7px;border-bottom:1px solid var(--line)}.barWrap{height:100%;flex:1;display:flex;align-items:end;position:relative}.bar{width:100%;min-height:2px;border-radius:5px 5px 0 0;background:linear-gradient(#75d9d1,#9e91ff)}.barWrap:hover:after{content:attr(data-tip);position:absolute;bottom:calc(var(--h) + 8px);left:50%;transform:translateX(-50%);background:#050914;padding:5px 7px;border-radius:6px;white-space:nowrap;font-size:11px}.labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:8px}.healthRow{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0}.healthRow:first-of-type{border:0}.good{color:var(--good)}.bad{color:var(--bad)}footer{color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:780px){.grid{grid-template-columns:repeat(2,1fr)}.sections{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.card strong{font-size:24px}.wrap{padding:20px 12px}}
</style></head><body><main class="wrap"><header><div><h1>Kampit Dashboard</h1><p>Aggregate production activity</p></div><div id="status">Loading…</div></header><section id="cards" class="grid"></section><section class="sections"><div class="chart"><h2>GAMES · LAST 14 DAYS</h2><div id="bars" class="bars"></div><div class="labels"><span id="from"></span><span id="to"></span></div></div><div class="chart"><h2>SERVICE HEALTH</h2><div class="healthRow"><span>SOL price feed</span><strong id="feed"></strong></div><div class="healthRow"><span>Live connections</span><strong id="connections"></strong></div><div class="healthRow"><span>Result delivery backlog</span><strong id="backlog"></strong></div><div class="healthRow"><span>Payment backlog</span><strong id="paymentBacklog"></strong></div><div class="healthRow"><span>Treasury SOL</span><strong id="treasurySol"></strong></div><div class="healthRow"><span>Treasury test USDC</span><strong id="treasuryUsdc"></strong></div><div class="healthRow"><span>Treasury alerts</span><strong id="treasuryAlerts"></strong></div></div></section><footer id="updated"></footer></main>
<script>
const format=n=>new Intl.NumberFormat().format(n);const card=(label,value)=>`<article class="card"><span>${label}</span><strong>${format(value)}</strong></article>`;
async function refresh(){try{const r=await fetch('/admin/metrics',{cache:'no-store'});if(!r.ok)throw new Error('Dashboard request failed');const d=await r.json();const cards=[['Registered users',d.users],['Active · 24 hours',d.active24h],['Active · 7 days',d.active7d],['Telegram groups',d.groups],['Total games',d.battles],['Games in progress',d.activeBattles],['Completed games',d.completedBattles],['Void games',d.voidBattles],['Average players',d.averagePlayers],['Maximum players',d.maxPlayers],['XP in accounts',d.totalXp],['XP currently staked',d.stakedXp],['XP burned',d.burnedXp],['Successful referrals',d.referrals],['Active · 30 days',d.active30d]];document.getElementById('cards').innerHTML=cards.map(x=>card(...x)).join('');const max=Math.max(1,...d.gamesByDay.map(x=>x.games));document.getElementById('bars').innerHTML=d.gamesByDay.map(x=>`<div class="barWrap" style="--h:${Math.max(2,x.games/max*100)}%" data-tip="${x.date}: ${x.games}"><div class="bar" style="height:${Math.max(2,x.games/max*100)}%"></div></div>`).join('');document.getElementById('from').textContent=d.gamesByDay[0].date;document.getElementById('to').textContent=d.gamesByDay.at(-1).date;document.getElementById('feed').textContent=d.health.priceFresh?'HEALTHY':'STALE';document.getElementById('feed').className=d.health.priceFresh?'good':'bad';document.getElementById('connections').textContent=format(d.health.connectedPlayers);document.getElementById('backlog').textContent=format(d.resultDeliveryBacklog);document.getElementById('backlog').className=d.resultDeliveryBacklog?'bad':'good';const p=d.health.payments;document.getElementById('paymentBacklog').textContent=p?format(p.pending):'DISABLED';document.getElementById('paymentBacklog').className=p?.pending?'bad':'good';document.getElementById('treasurySol').textContent=p?(p.treasury.solLamports/1e9).toFixed(4):'—';document.getElementById('treasuryUsdc').textContent=p?(p.treasury.usdcMinor/1e6).toFixed(2):'—';document.getElementById('treasuryAlerts').textContent=p?.alerts.length?p.alerts.join(' · '):'NONE';document.getElementById('treasuryAlerts').className=p?.alerts.length?'bad':'good';document.getElementById('status').textContent='● LIVE';document.getElementById('status').className='good';document.getElementById('updated').textContent='Updated '+new Date(d.generatedAt).toLocaleString();}catch(e){document.getElementById('status').textContent='● UNAVAILABLE';document.getElementById('status').className='bad';}}refresh();setInterval(refresh,30000);
</script></body></html>
